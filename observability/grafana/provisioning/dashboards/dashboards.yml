# Carga los dashboards JSON de observability/grafana/dashboards (generados por generar.py).
apiVersion: 1

providers:
  - name: sgtu
    orgId: 1
    folder: SGTU
    folderUid: sgtu
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
